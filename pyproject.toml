[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlagent"
version = "0.1.0"
description = "Natural-language to SQL agent with guardrails, evals and CI"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "sqlglot>=25",
  "faker>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sqlagent = "sqlagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
